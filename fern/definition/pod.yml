imports:
  common: ./common.yml
types:
  StatusTypes:
    enum:
      - Pending
      - Running
      - Succeeded
      - Failed
      - Unknown
  StatusInfo:
    properties:
      status: StatusTypes
      podIp: optional<string>
      hostIp: optional<string>
  ContainerPortInfo:
    properties:
      port: integer
      protocol: common.ProtocolTypes
  SecurityContextInfo:
    properties:
      runAsRoot: optional<boolean>
      allowPrivilegeEscalation: optional<boolean>
      readOnlyRootFilesystem: optional<boolean>
  ContainerInfo:
    properties:
      name: string
      image: string
      ports: optional<list<ContainerPortInfo>>
      securityContext: optional<SecurityContextInfo>
  Pod:
    properties:
      uid: string
      name: string
      version: string
      status: StatusInfo
      namespace: common.NamespaceInfo
      node: optional<common.NodeInfo>
      containers: list<ContainerInfo>
      labels: optional<map<string, string>>
      annotations: optional<map<string, string>>
  PodReport:
    properties:
      pods: optional<list<Pod>>
      clusterUrl: optional<string>
      authType: common.AuthTypes
      errors: optional<list<string>>