types:
  ProtocolTypes:
    enum:
      - HTTP
      - HTTPS
      - TCP
      - TLS
      - UDP
      - TCP_UDP
      - GENEVE
      - UNDEFINED
  AuthTypes:
    enum:
      - KUBECONFIG
      - TOKEN_WITH_CA_CERT
      - TOKEN_WITHOUT_CA_CERT
      - UNAUTHENTICATED
      - UNKNOWN
  NamespaceInfo:
    properties:
      uid: string
      name: string
  NodeInfo:
    properties:
      uid: string
      name: string
  PodInfo:
    properties:
      uid: string
      name: string
  ServiceInfo:
    properties:
      uid: string
      name: string
      namespace: NamespaceInfo