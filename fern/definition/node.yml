imports:
  common: ./common.yml
types:
  StateTypes:
    enum:
      - Running
      - Stopped
  AddressInfo:
    properties:
      type: string
      address: string
  Node:
    properties:
      name: string
      arch: string
      image: string
      os: string
      version: optional<string>
      state: StateTypes
      instancetype: optional<string>
      addresses: list<AddressInfo>
  NodeReport:
    properties:
      nodes: optional<list<Node>>
      clusterUrl: optional<string>
      authType: common.AuthTypes
      errors: optional<list<string>>


