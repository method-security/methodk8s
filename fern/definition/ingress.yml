imports:
  common: ./common.yml
types:
  RuleInfo:
    properties:
      path: string
      base: string
      port: optional<string>
      serviceName: string
  Ingress:
    properties:
      name: string
      namespace: common.NamespaceInfo
      rules: optional<list<RuleInfo>>
      annotations: optional<map<string, string>>
      labels: optional<map<string, string>>
  ServiceInfo:
    properties:
      name: string
      namespace: common.NamespaceInfo
  PathInfo:
    properties:
      path: string
      base: string
      port: optional<string>
      service: ServiceInfo
  GatewayInfo:
    properties:
      name: string
      namespace: common.NamespaceInfo
  HttpRoute:
    properties:
      name: string
      namespace: common.NamespaceInfo
      annotations: optional<map<string, string>>
      labels: optional<map<string, string>>
      gateways: optional<list<GatewayInfo>>
      paths: optional<list<PathInfo>>
  IngressReport:
    properties:
      httpRoutes: optional<list<HttpRoute>>
      ingresses: optional<list<Ingress>>
      clusterUrl: optional<string>
      authType: common.AuthTypes
      errors: optional<list<string>>